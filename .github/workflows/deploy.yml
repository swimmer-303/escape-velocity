# Written with AI assistance (Claude Code). See README "Use of AI tools".
# Every push to main: test, build, and deploy to Cloudflare Workers (wrangler.jsonc).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The deploy steps run only once the Cloudflare secrets are set (tests and build always run).
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:worker
      - name: Deploy to Cloudflare
        if: env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke check
        if: env.CAN_DEPLOY == 'true'
        run: |
          curl -fsS https://playescapevelocity.com/ -o /dev/null
          curl -fsS "https://playescapevelocity.com/api/spaceweather?days=30" | head -c 200
